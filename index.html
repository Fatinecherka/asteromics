<!DOCTYPE html>
<html lang="en" data-theme="day" data-mode="brightfield">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("asteromics-theme");
        if (t === "day" || t === "night") {
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.setAttribute("data-mode", t === "day" ? "brightfield" : "darkfield");
        }
      } catch (e) {}
      function syncToggle() {
        var tg = document.getElementById("tg");
        if (!tg) return;
        var theme = document.documentElement.getAttribute("data-theme") || "day";
        tg.textContent = theme === "day" ? "Night" : "Day";
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", syncToggle);
      else syncToggle();
    })();
  </script>
  <title>AsterOmics</title>
  <meta name="description" content="AsterOmics provides omics data analysis for research laboratories, universities and companies.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Karla:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="preload" href="/src/styles.css" as="style">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <main id="app"></main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
